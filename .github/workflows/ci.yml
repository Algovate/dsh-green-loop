name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax checks
        run: |
          node --check index.js
          node --check client.js
          node --check engine.js
          node --check detect.js
          node --check loop.js
      - name: Tests
        run: node --test test/*.test.js
      - name: Package contents
        run: npm pack --dry-run
